server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name whaletodo.top www.whaletodo.top;
    root /var/www/whaletodo/current;
    index index.html;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/whaletodo/acme; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name api.whaletodo.top;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/whaletodo/acme; }
    location / { return 503 '{"error":{"code":"SERVICE_NOT_READY","message":"API service is not deployed"}}'; }
}
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/whaletodo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whaletodo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WhaleToDo:1m;
    ssl_session_timeout 1d;
    server_name whaletodo.top www.whaletodo.top;
    root /var/www/whaletodo/current;
    index index.html;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/whaletodo/acme; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/whaletodo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whaletodo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WhaleToDo:1m;
    ssl_session_timeout 1d;
    server_name api.whaletodo.top;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/whaletodo/acme; }
    location = /api/v1/ai/requests {
        limit_req zone=whaletodo_ai_ip burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/whaletodo-ai-proxy.conf;
    }
    location ^~ /api/v1/ai/ {
        limit_req zone=whaletodo_ai_ip burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/whaletodo-ai-proxy.conf;
    }
    location / { return 503 '{"error":{"code":"SERVICE_NOT_READY","message":"API service is not deployed"}}'; }
}
