name: Server checks

on:
  push:
    paths:
      - 'server/**'
      - 'env/postgresql/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'env/postgresql/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sh -n ../script/backup-database.sh
      - name: TypeScript 类型检查
        run: npm run typecheck
      - name: 单元与接口测试
        run: npm test
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whaletodo_verify
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      PGPASSWORD: ci-only-password
      DATABASE_URL: postgresql://whaletodo_migrator:ci-migration-only@127.0.0.1:5432/whaletodo_verify?schema=whaletodo
      VERIFY_DATABASE_URL: postgresql://whaletodo_migrator:ci-migration-only@127.0.0.1:5432/whaletodo_verify?schema=whaletodo
      VERIFY_APP_URL: postgresql://whaletodo_app:ci-runtime-only@127.0.0.1:5432/whaletodo_verify
      VERIFY_AI_URL: postgresql://whaletodo_ai:ci-ai-only@127.0.0.1:5432/whaletodo_verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolated CI database roles (synthetic passwords only)
        run: psql -h 127.0.0.1 -U postgres -d whaletodo_verify -v ON_ERROR_STOP=1 -f ../env/postgresql/ci-roles.sql
      - run: npm run db:deploy
      - run: npm run db:validate
      - name: Runtime permission boundary
        run: psql -h 127.0.0.1 -U postgres -d whaletodo_verify -v ON_ERROR_STOP=1 -f ../env/postgresql/grants.sql
      - run: npm run test:database
